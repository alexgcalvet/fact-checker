<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<style>
$fonts
/* The InterviewCompare of the CALVET canvas, 4:5: one column per person, the same measures on the same rows; every
   text 30 px or more. */
:root{--n0:#05070B;--bone:#E6DCC4;--warm:#FFF0D6;--t1:rgba(238,236,229,.95);--t2:rgba(226,229,234,.6);--t3:rgba(214,219,227,.55);--grey:#5A6680;--green:#29A98E;--amber:#D99A2B;--red:#E5484D;--mag:#D06BA8;--ring:0 0 0 .5px rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#07090D}
.root{position:relative;width:1080px;height:1350px;overflow:hidden;padding:56px 56px 0;display:flex;flex-direction:column;color:var(--t1);font:450 30px/1.15 'Host Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.sc{font:500 30px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(238,236,229,.78);white-space:nowrap}
.sub{margin-top:18px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--t1);font-weight:500}
.sun{display:inline-block;width:12px;height:12px;margin-left:14px;vertical-align:4px;border-radius:50%;background:#F2D9A6;box-shadow:0 0 0 3px #0F131B,0 0 4px 4px #D8A84E,0 0 18px 6px rgba(216,168,78,.45)}
.lab{color:var(--t2)}
.big{font-size:64px;font-weight:300;letter-spacing:-.045em;line-height:.95;color:var(--bone)}
.vi{display:block;flex-shrink:0;overflow:visible}
.vc-fa{color:var(--red)}.vc-en{color:var(--amber)}.vc-re{color:var(--mag)}.vc-ok{color:var(--green)}.vc-pu{color:var(--grey)}

/* The Fault: a 1px horizon that steps once at 45deg. */
.faultbox{position:relative;flex:none;margin-top:24px;height:21px}
.fault{position:absolute;left:0;right:0;top:0;height:21px;--s:20px;--x:600px;--fc:230,220,196}
.fault>i{position:absolute;height:1px;display:block}
.f-a{left:0;top:var(--s);width:var(--x);background:linear-gradient(90deg,rgba(var(--fc),0),rgba(var(--fc),.6))}
.f-d{left:var(--x);top:var(--s);width:calc(var(--s) * 1.4142);background:rgba(var(--fc),.75);transform-origin:0 0;transform:rotate(-45deg)}
.f-b{left:calc(var(--x) + var(--s));right:0;top:0;background:linear-gradient(90deg,rgba(var(--fc),.85),rgba(var(--fc),0))}

/* One column per person. */
.cols{margin-top:28px;display:grid;grid-template-columns:repeat($count,minmax(0,1fr));column-gap:28px}
.col{position:relative;min-width:0}
.col+.col::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.08)}
.thumb{position:relative;height:140px;border-radius:14px;overflow:hidden;box-shadow:var(--ring)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;filter:brightness(.85) saturate(.9)}
.p-none{position:absolute;inset:0;background:linear-gradient(135deg,#1C2433,#0F131B 60%,#07090D)}
.name{margin-top:18px;min-height:2em;font:400 40px/1 'Newsreader',serif;letter-spacing:-.01em;color:var(--bone)}
.line{margin-top:8px;min-height:2.3em}
.head{margin-top:22px}
.val{margin-top:6px;display:flex;align-items:baseline;gap:14px}
.bar{display:flex;gap:3px;height:14px;margin-top:12px}
.bar>i{display:block;border-radius:4px}
/* Two lines for every device, so the rows below stay level across the columns. */
.dev{margin-top:10px;min-height:69px;display:flex;align-items:flex-start;gap:12px}
.dev .vi{margin-top:3px}
.times{margin-top:4px}

/* The legend of the bars, then the footer with the wordmark. */
.legend{margin-top:30px;display:flex;gap:28px}
.leg{display:flex;align-items:center;gap:10px;white-space:nowrap}
.foot{position:absolute;left:56px;right:56px;bottom:40px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.foot .lab{white-space:nowrap}
.foot .lab b{color:var(--t1);font-weight:500}
.logo{flex:none;width:200px;height:47px}
.logo svg{display:block;width:200px;height:47px}
</style>
</head>
<body>
<div class="root">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs><filter id="halo" filterUnits="userSpaceOnUse" x="-12" y="-12" width="24" height="24"><feGaussianBlur stdDeviation="1.8"></feGaussianBlur></filter></defs>
<symbol id="f2-fa" viewBox="-8 -8 16 16" style="overflow:visible" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="7" fill="currentColor" opacity=".7" filter="url(#halo)"></circle><circle r="5.6" fill="currentColor"></circle><circle r="3.4" style="fill:var(--warm)" opacity=".22"></circle><path d="M-2.3 -2.3L2.3 2.3M2.3 -2.3L-2.3 2.3" transform="scale(0.92)" stroke-width="1.85" style="stroke:var(--n0)"></path></symbol>
<symbol id="f2-en" viewBox="-8 -8 16 16" style="overflow:visible" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="7" fill="currentColor" opacity=".7" filter="url(#halo)"></circle><circle r="5.6" fill="currentColor"></circle><circle r="3.4" style="fill:var(--warm)" opacity=".22"></circle><path d="M0 -3.1V0.6M0 2.7V2.8" transform="scale(0.92)" stroke-width="1.85" style="stroke:var(--n0)"></path></symbol>
<symbol id="f2-re" viewBox="-8 -8 16 16" style="overflow:visible" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="7" fill="currentColor" opacity=".7" filter="url(#halo)"></circle><circle r="5.6" fill="currentColor"></circle><circle r="3.4" style="fill:var(--warm)" opacity=".22"></circle><path d="M-3 0.9C-2 -1.5 -0.9 -1.3 0 0S2 1.5 3 -0.9" transform="scale(0.92)" stroke-width="1.85" style="stroke:var(--n0)"></path></symbol>
<symbol id="f2-ok" viewBox="-8 -8 16 16" style="overflow:visible" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="7" fill="currentColor" opacity=".7" filter="url(#halo)"></circle><circle r="5.6" fill="currentColor"></circle><circle r="3.4" style="fill:var(--warm)" opacity=".22"></circle><path d="M-2.8 0.1L-0.8 2.2L2.9 -2.1" transform="scale(0.92)" stroke-width="1.85" style="stroke:var(--n0)"></path></symbol>
</svg>

<div data-block="head"><div class="sc">$kicker</div><div class="sub">$sub<span class="sun"></span></div></div>
<div class="faultbox" data-block="fault"><div class="fault"><i class="f-a"></i><i class="f-d"></i><i class="f-b"></i></div></div>
<div class="cols" data-block="cols">$columns</div>
<div class="legend" data-block="legend">$legend</div>
<div class="foot" data-block="foot"><div class="lab">$footer</div><div class="logo" data-block="logo">$wordmark</div></div>
</div>
</body>
</html>
