<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; gap: 16px; padding-bottom: 18px;
    background: #0b0d10; color: #f4f5f7; font: 26px/1.25 -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .clamp.one { -webkit-line-clamp: 1; }
  .clamp.three { -webkit-line-clamp: 3; }
  .muted { color: #9aa2ad; }

  /* Hero: the video thumbnail under a dark gradient. */
  section.title {
    flex: none; position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
    height: $hero_height; padding: 0 44px 20px;
    background: $hero center / cover no-repeat;
  }
  section.title::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,13,16,.15) 0%, rgba(11,13,16,.72) 50%, #0b0d10 100%),
                linear-gradient(90deg, rgba(11,13,16,.7) 0%, rgba(11,13,16,0) 75%);
  }
  section.title > * { position: relative; }
  .kicker {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 4px 16px 4px 12px; border-radius: 999px;
    background: rgba(255,107,107,.16); color: #fff; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  }
  .kicker i { width: 14px; height: 14px; border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 0 5px rgba(255,107,107,.25); }
  section.title h1 { font-size: 60px; line-height: 1.08; font-weight: 850; letter-spacing: -.02em; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  section.title .subtitle { font-size: 30px; line-height: 1.2; font-weight: 600; color: #e9ecef; }
  section.title .subtitle:empty { display: none; }
  section.title .subtitle.four { -webkit-line-clamp: 1; }
  section.title .meta { display: flex; align-items: center; gap: 16px; font-size: 28px; color: #d0d5db; }
  section.title .meta p { min-width: 0; }

  /* Timeline: one track per speaker over the whole video. */
  section.timeline { flex: none; margin: 0 32px; padding: 12px 24px 6px; border-radius: 22px; background: #15181d; }
  .row { display: flex; align-items: center; gap: 18px; height: $row_height; }
  .who { width: 210px; flex: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 700; }
  .track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: #2c323a; }
  .track i { position: absolute; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px #15181d; }
  .axis { position: relative; height: 36px; margin: 4px 14px 0 228px; border-top: 1px solid #2c323a; }
  .axis span { position: absolute; top: 2px; transform: translateX(-50%); color: #8a929c; font-variant-numeric: tabular-nums; }
  .axis span:first-child { transform: none; }
  .axis span:last-child:not(:first-child) { transform: translateX(-100%); }
  .axis b { position: absolute; top: -7px; width: 1px; height: 7px; background: #4a525c; }

  /* Face-off: one panel per speaker. */
  .columns { flex: 1; min-height: 0; display: grid; gap: 18px; margin: 0 32px; grid-template-columns: 1fr 1fr; }
  .columns.one { grid-template-columns: 1fr; }
  .columns.four { grid-template-rows: 1fr 1fr; }
  .columns.four section.speaker:nth-child(3):last-child { grid-column: span 2; }
  section.speaker {
    min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px 22px 18px;
    border-radius: 22px; background: linear-gradient(180deg, #1a1e24, #13161a); overflow: hidden;
  }
  .head { display: flex; align-items: center; gap: 22px; }
  .donut { position: relative; flex: none; width: $donut_size; height: $donut_size; }
  .donut svg { position: absolute; inset: 0; }
  .donut div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.02; }
  .donut strong { font-size: $total_size; font-weight: 850; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .donut span { color: #9aa2ad; }
  .side { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .side h2 { font-size: 34px; line-height: 1.1; font-weight: 850; letter-spacing: -.01em; }
  .side .role { margin-top: -4px; color: #9aa2ad; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .chip { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip em { font-style: normal; font-weight: 400; color: #9aa2ad; }
  .badge {
    flex: none; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
    border-radius: 50%; color: #0b0d10; font-weight: 900; font-style: normal; line-height: 1;
  }

  /* Highlights: the most serious reviewed flags, as many as fit. */
  .items { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .item {
    flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: 5px 14px 7px 16px; border-radius: 14px; background: #0f1215; border-left: 5px solid;
  }
  .ref { font-weight: 700; }
  .ref .badge { width: 30px; height: 30px; margin-right: 8px; vertical-align: -4px; }
  .ref b { font-variant-numeric: tabular-nums; margin-right: 4px; }
  .ref .muted { font-weight: 400; }
  .quote { font-size: 27px; line-height: 1.17; font-style: italic; color: #e3e6ea; }
  .four .head { gap: 20px; }
  .four section.speaker { gap: 10px; padding: 16px 20px; }
  .four .side { gap: 6px; }
  .four .side h2 { font-size: 34px; }
  .four .quote { -webkit-line-clamp: 1; }
  .four .items { gap: 6px; }
  .four .item { padding: 4px 14px 6px 16px; }
  .none { flex: 1; display: flex; align-items: center; justify-content: center; color: #8a929c; }

  section.footer { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0 32px; }
  section.footer .legend { justify-content: center; gap: 6px 14px; }
  section.footer .chip { gap: 6px; }
  section.footer .chip { font-weight: 400; color: #b4bac2; }
  section.footer .badge { width: 28px; height: 28px; }
  section.footer p { color: #8a929c; }
  section.footer p b { color: #f4f5f7; }
</style>
</head>
<body>
  <section class="title">
    <h1 class="clamp one">$title</h1>
    <p class="subtitle clamp $layout">$subtitle</p>
    <div class="meta"><span class="kicker"><i></i>$kicker</span><p class="clamp one">$meta</p></div>
  </section>
  <section class="timeline">$timeline</section>
  <div class="columns $layout">$columns</div>
  <section class="footer"><div class="legend">$legend</div><p>$footer</p></section>
  <script>
    // Drop the last highlights of a panel until the rest fit.
    for (const list of document.querySelectorAll(".items"))
      while (list.scrollHeight > list.clientHeight + 1 && list.children.length > 1) list.lastElementChild.remove();
  </script>
</body>
</html>
